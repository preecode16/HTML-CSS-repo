<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin</title>
    <style>
        * {
            margin: 0;
            padding: 0;

        }

        p {
            border: 2px solid green;
            margin: 23px;
            background-color: yellow;
            padding: 34px
        }

        h1 {
            border: 2px solid red;
            margin: 23px;
            background-color: aqua;
            padding:23px;
        }
    </style>
</head>

<body>
    <div>
        <h1>
            Margin
        </h1>
        <p>This is a paragraph</p>
        <p>this is anoother paragraph</p>
        <p>this is a yet another paragraph</p>
    </div>

</body>

</html>
